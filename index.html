<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bake With Sourdough — the bumper magnet</title>
<meta name="description" content="BAKE WITH SOURDOUGH. IT COULD SAVE YOUR LOAF. A loving parody of New Hampshire's official BRAKE FOR MOOSE bumper sticker, as a magnet for bakers.">
<meta property="og:title" content="Bake With Sourdough — the bumper magnet">
<meta property="og:description" content="IT COULD SAVE YOUR LOAF. Get the magnet.">
<meta property="og:image" content="https://saveyourloaf.com/hero.png?v=3">
<link rel="canonical" href="https://saveyourloaf.com/">
<meta property="og:type" content="product">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍞</text></svg>">
<style>
  :root{
    --yellow:#FEDD00;   /* Pantone Yellow C — matched to the original sticker */
    --ink:#111111;
    --paper:#fffdf2;
    --bad:#c0261a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--yellow);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  main{width:100%;max-width:560px}
  .stack{margin:6px -16px 20px;overflow:hidden;padding:16px 12px 20px;display:flex;flex-direction:column;gap:14px}
  .stack img{
    width:103%;margin-left:-1.5%;height:auto;display:block;
    border:3px solid var(--ink);border-radius:8px;
    box-shadow:9px 11px 0 var(--ink);
    background:var(--yellow);
  }
  .stack .s1{transform:rotate(-5deg)}
  .stack .s2{transform:rotate(2.5deg)}
  .stack .s3{transform:rotate(-2deg)}
  h1{
    font-size:clamp(26px,7.5vw,38px);
    line-height:1.05;letter-spacing:.5px;
    text-transform:uppercase;font-weight:900;
    margin:4px 0 6px;
  }
  .tag{font-size:17px;font-weight:600;margin-bottom:16px}
  .card{
    background:var(--paper);
    border:3px solid var(--ink);border-radius:16px;
    padding:18px 16px;margin-bottom:16px;
  }
  .badge{display:inline-block;background:var(--ink);color:var(--yellow);font-weight:900;letter-spacing:1.5px;font-size:12px;padding:5px 12px;border-radius:999px;margin-bottom:12px}
  .pricerow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .price{font-size:30px;font-weight:900}
  .each{font-size:13px;font-weight:600;opacity:.65}
  .qty{display:flex;align-items:center;gap:0;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
  .qty button{
    width:56px;height:56px;border:0;background:var(--ink);color:var(--yellow);
    font-size:28px;font-weight:900;cursor:pointer;touch-action:manipulation;
  }
  .qty button:active{opacity:.8}
  .qty output{width:64px;text-align:center;font-size:24px;font-weight:900;background:#fff}
  .fulfill{display:flex;gap:12px;margin-bottom:14px}
  .opt{
    flex:1;display:flex;align-items:center;gap:12px;
    border:3px solid var(--ink);border-radius:14px;background:#fff;
    padding:14px 12px;cursor:pointer;touch-action:manipulation;
    font:inherit;text-align:left;min-height:64px;
  }
  .opt .box{
    width:26px;height:26px;flex:0 0 26px;border:3px solid var(--ink);border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:900;color:transparent;background:#fff;
  }
  .opt b{display:block;font-size:16.5px}
  .opt small{display:block;font-size:12.5px;font-weight:600;opacity:.65}
  .opt.on{background:var(--ink);color:var(--yellow)}
  .opt.on small{opacity:.8}
  .opt.on .box{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
  .addr{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .addr input{
    width:100%;border:3px solid var(--ink);border-radius:10px;background:#fff;
    font:600 16px/1.2 inherit;font-family:inherit;padding:13px 12px;outline:none;
  }
  .addr input:focus{box-shadow:3px 3px 0 var(--ink)}
  .addr input.bad{border-color:var(--bad)}
  .row2{display:flex;gap:10px}
  .row2 input:nth-child(1){flex:2.2}
  .row2 input:nth-child(2){flex:.9;text-transform:uppercase}
  .row2 input:nth-child(3){flex:1.1}
  .addr-msg{font-size:13px;font-weight:700;color:var(--bad);min-height:16px}
  .addr-msg.ok{color:#1c7a2e}
  .hint{font-size:13px;font-weight:600;opacity:.7}
  .total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin:6px 2px 14px}
  .buy{display:flex;flex-direction:column;gap:12px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:58px;border-radius:14px;border:3px solid var(--ink);
    font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;
    text-decoration:none;color:var(--yellow);background:var(--ink);
    touch-action:manipulation;
  }
  .btn:active{transform:translateY(1px)}
  .btn.off{opacity:.35;pointer-events:none}
  .fine{font-size:13px;line-height:1.5;opacity:.75;margin-top:10px}
</style>
</head>
<body>
<main>
  <div class="stack">
    <img class="s1" src="hero.png?v=3" alt="Yellow bumper magnet: BAKE WITH SOURDOUGH — IT COULD SAVE YOUR LOAF, with a dark loaf of bread inside a road-sign diamond">
    <img class="s2" src="hero.png?v=3" alt="">
    <img class="s3" src="hero.png?v=3" alt="">
  </div>

  <h1>Bake With Sourdough<br>— the bumper magnet</h1>
  <p class="tag">It could save your loaf.</p>

  <div class="card">
    <span class="badge" id="preBadge" hidden>PREORDER</span>
    <div class="pricerow">
      <div><span class="price" id="priceEl"></span> <span class="each">each</span></div>
      <div class="qty" role="group" aria-label="Quantity">
        <button type="button" aria-label="Fewer" onclick="bump(-1)">−</button>
        <output id="qtyEl" aria-live="polite">1</output>
        <button type="button" aria-label="More" onclick="bump(1)">+</button>
      </div>
    </div>

    <div class="fulfill" role="group" aria-label="Shipping or pickup">
      <button type="button" class="opt" id="optShip" onclick="setMode('ship')">
        <span class="box">✓</span><span><b>Ship it</b><small id="shipSub"></small></span>
      </button>
      <button type="button" class="opt" id="optPick" onclick="setMode('pickup')">
        <span class="box">✓</span><span><b>Pick it up</b><small>free · Peterborough NH</small></span>
      </button>
    </div>

    <div class="addr" id="addrBox" hidden>
      <input id="aName" placeholder="Name" autocomplete="name" oninput="revalidate()">
      <input id="aEmail" type="email" placeholder="Email" autocomplete="email" oninput="revalidate()">
      <input id="aStreet" placeholder="Street address" autocomplete="street-address" oninput="revalidate()">
      <div class="row2">
        <input id="aCity" placeholder="City" autocomplete="address-level2" oninput="revalidate()">
        <input id="aState" placeholder="ST" maxlength="2" autocomplete="address-level1" oninput="revalidate()">
        <input id="aZip" placeholder="ZIP" inputmode="numeric" maxlength="5" autocomplete="postal-code" oninput="zipChanged()">
      </div>
      <div class="addr-msg" id="addrMsg"></div>
    </div>

    <div class="addr" id="pickBox" hidden>
      <input id="pEmail" type="email" placeholder="Email" autocomplete="email" oninput="revalidate()">
      <div class="hint">We'll send you the pickup address when it's ready.</div>
    </div>

    <div class="total"><span>Total</span><span id="totalEl"></span></div>
    <div class="buy" id="buyBtns"></div>
    <p class="fine">For bakers, movers, shakers, kneeders, givers, takers</p>
  </div>
</main>

<script>
/* ====== CONFIG — edit these and redeploy ====== */
const PRICE    = 8;              // dollars each
const SHIP     = 7;              // flat shipping when "Ship it" is chosen
const VENMO    = "Ben-Martel";   // venmo.com/u/Ben-Martel
const PREORDER = true;           // preorder badge; set false when shipping from stock
/* ============================================== */

let qty = 1, mode = null, zipInfo = { zip: "", state: "", ok: false, checked: false };
const $ = id => document.getElementById(id);
const money = n => "$" + (n % 1 ? n.toFixed(2) : n);
const val = id => $(id).value.trim();

const STATES = "AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC".split(" ");
const EMAILRX = /^\S+@\S+\.\S+$/;

function total(){ return qty*PRICE + (mode === "ship" ? SHIP : 0); }

function fieldChecks(){
  return {
    aName:   val("aName").length >= 2,
    aEmail:  EMAILRX.test(val("aEmail")),
    aStreet: val("aStreet").length >= 4 && /\d/.test(val("aStreet")),
    aCity:   val("aCity").length >= 2,
    aState:  STATES.includes(val("aState").toUpperCase()),
    aZip:    /^\d{5}$/.test(val("aZip")),
  };
}

function addressValid(){
  const c = fieldChecks();
  if (!Object.values(c).every(Boolean)) return false;
  if (zipInfo.checked && zipInfo.zip === val("aZip")){
    if (!zipInfo.ok) return false;
    if (zipInfo.state && zipInfo.state !== val("aState").toUpperCase()) return false;
  }
  return true;
}

async function zipChanged(){
  const z = val("aZip");
  if (!/^\d{5}$/.test(z)){ zipInfo = {zip:z, state:"", ok:false, checked:false}; revalidate(); return; }
  try {
    const r = await fetch("https://api.zippopotam.us/us/" + z);
    if (r.ok){
      const d = await r.json();
      const place = d.places && d.places[0];
      zipInfo = { zip: z, state: place ? place["state abbreviation"] : "", ok: true, checked: true };
      if (place){
        if (!val("aCity")) $("aCity").value = place["place name"];
        if (!val("aState")) $("aState").value = place["state abbreviation"];
      }
    } else {
      zipInfo = { zip: z, state: "", ok: false, checked: true };
    }
  } catch(e){
    zipInfo = { zip: z, state: "", ok: true, checked: false }; // offline: don't block the sale
  }
  revalidate();
}

function revalidate(){
  const c = fieldChecks();
  for (const id in c) $(id).classList.toggle("bad", $(id).value.trim() !== "" && !c[id]);
  $("pEmail").classList.toggle("bad", val("pEmail") !== "" && !EMAILRX.test(val("pEmail")));
  const msg = $("addrMsg");
  msg.className = "addr-msg";
  if (mode === "ship"){
    if (zipInfo.checked && zipInfo.zip === val("aZip") && !zipInfo.ok && c.aZip){
      msg.textContent = "That ZIP doesn't exist — double-check it.";
    } else if (zipInfo.checked && zipInfo.ok && zipInfo.state && c.aState && zipInfo.state !== val("aState").toUpperCase()){
      msg.textContent = "ZIP " + val("aZip") + " is in " + zipInfo.state + ", not " + val("aState").toUpperCase() + ".";
    } else if (addressValid()){
      msg.textContent = "Address checks out.";
      msg.className = "addr-msg ok";
    } else {
      msg.textContent = "";
    }
  }
  render();
}

function setMode(m){
  mode = m;
  $("optShip").classList.toggle("on", m === "ship");
  $("optPick").classList.toggle("on", m === "pickup");
  $("addrBox").hidden = (m !== "ship");
  $("pickBox").hidden = (m !== "pickup");
  if (m === "pickup" && !val("pEmail") && val("aEmail")) $("pEmail").value = val("aEmail");
  if (m === "ship" && !val("aEmail") && val("pEmail")) $("aEmail").value = val("pEmail");
  revalidate();
}

function packNote(parts){
  // Venmo turns real spaces into "+", so join with non-breaking spaces (renders like normal spaces)
  const t = parts.join(" ").replace(/[,]+/g," ").replace(/\s+/g," ").trim();
  return encodeURIComponent(t.replace(/ /g, " "));
}

function venmoHref(){
  const m = `${qty} magnet${qty>1?"s":""}`;
  const note = (mode === "pickup")
    ? packNote([m, "PICKUP", val("pEmail")])
    : packNote([m, "ship to:", val("aName"), val("aStreet"), val("aCity"), val("aState").toUpperCase(), val("aZip"), val("aEmail")]);
  return `https://venmo.com/${VENMO}?txn=pay&amount=${total()}&note=${note}`;
}

function render(){
  $("preBadge").hidden = !PREORDER;
  $("qtyEl").textContent = qty;
  $("priceEl").textContent = money(PRICE);
  $("shipSub").textContent = "+" + money(SHIP) + " flat";
  $("totalEl").textContent = money(total()) + (mode === "ship" ? " incl. shipping" : (mode === "pickup" ? " · pickup" : ""));
  const ready = (mode === "pickup" && EMAILRX.test(val("pEmail"))) || (mode === "ship" && addressValid());
  const label = mode === null ? "Choose ship or pickup"
    : (ready ? "Pay with Venmo" : (mode === "pickup" ? "Add your email" : "Fill in your details"));
  $("buyBtns").innerHTML = ready
    ? `<a class="btn" href="${venmoHref()}">Pay with Venmo</a>`
    : `<div class="btn off">${label}</div>`;
}

function bump(d){ qty = Math.min(99, Math.max(1, qty + d)); render(); }
render();
</script>
</body>
</html>
