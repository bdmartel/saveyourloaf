<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loaf Log — Save Your Loaf</title>
<meta name="description" content="Photo log of the BAKE WITH SOURDOUGH bumper magnet out in the world.">
<meta property="og:title" content="Loaf Log">
<meta property="og:description" content="The magnet, out in the world.">
<meta property="og:image" content="https://saveyourloaf.com/photos/2026-09-02-first-truck.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍞</text></svg>">
<style>
  :root{--yellow:#FEDD00;--ink:#111111;--paper:#fffdf2}
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  body{background:var(--yellow);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:max(20px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));}
  main{width:100%;max-width:560px}
  h1{font-size:clamp(30px,8vw,42px);text-transform:uppercase;font-weight:900;letter-spacing:.5px;margin:6px 0 2px}
  .sub{font-size:16px;font-weight:600;margin-bottom:26px}
  .sub a{color:var(--ink)}
  .entry{margin-bottom:34px}
  .entry img{width:100%;height:auto;display:block;border:3px solid var(--ink);border-radius:10px;box-shadow:8px 10px 0 var(--ink)}
  .meta{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 0}
  .cap{font-size:16px;font-weight:700}
  .date{font-size:13px;font-weight:600;opacity:.6}
  footer{margin-top:10px;font-size:13px;opacity:.7}
  footer a{color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>Loaf Log</h1>
  <p class="sub">The magnet, out in the world. Get yours at <a href="/">saveyourloaf.com</a>.</p>

  <!-- entries: newest first -->
  <div class="entry">
    <img src="2026-09-02-first-truck.jpg" alt="The BAKE WITH SOURDOUGH magnet on the chrome bumper of a green Toyota Tundra">
    <div class="meta"><span class="cap">The first one, on the first truck.</span><span class="date">Sep 2, 2026</span></div>
  </div>

  <footer><a href="/">&larr; back to the shop</a></footer>
</main>
</body>
</html>
